[project]
name = "ddnet-revision"
version = "0.1.0"
description = "Reproducible IEEE TGRS major-revision pipeline for DD-Net precipitation nowcasting"
requires-python = ">=3.11,<3.14"
dependencies = [
  "einops>=0.8,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<13",
  "pysteps==1.21.5",
  "pywavelets>=1.6,<2",
  "scikit-image>=0.24,<1",
  "scipy>=1.13,<2",
  "timm>=1.0,<2",
  "torch==2.12.1",
  "torch-geometric==2.8.0.post1",
  "torchvision==0.27.1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
ddnet-revision = "ddnet_revision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddnet_revision"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/ddnet_revision/models/vendor"]
