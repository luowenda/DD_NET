[model]
name = "ddnet_ablate_dcn_only_e100"
family = "trainable"
source = "pinned OpenSTL WaST backbone plus local DD-Net DCN Core"
implementation_status = "OPENSTL_WAST_BACKBONE_WITH_DDNET_DCN_ONLY"
configuration_status = "REVIEWER_Q7_COMPONENT_ABLATION"
backbone_source_commit = "eecf8a3078f0a178dbc7b28723da20f94ce36985"
encoder_dim = 20
block_list = [2, 8, 2]
drop_path_rate = 0.1
mlp_ratio = 4.0
attention_mode = "node"
batching_mode = "broadcast"
hypergraph_batching_revision = "isolated_v2"
wavelet_subband_grouping = "openstl"
residual_layer_scale_mode = "shared_openstl"
hypergraph_scales = ["small", "large"]
hyperedge_weighting = "adaptive"
use_hypergraph_encoder = false
use_dcn_core = true
use_modulation_mask = true
use_temporal_mixer = true
use_wavelet = true

[training]
epochs = 100
batch_size = 4
drop_last = true
optimizer = "adamw"
learning_rate = 0.0001
weight_decay = 0.01
optimizer_betas = [0.9, 0.999]
optimizer_eps = 0.00000001
loss = "mse_hffl"
hffl_weight = 0.001
scheduled_sampling = false
scheduler = "cosine"
minimum_learning_rate = 0.000001
gradient_clip_norm = 0.0
protocol_status = "REVIEWER_Q7_SINGLE_FACTOR_ABLATION"
