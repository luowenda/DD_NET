[model]
name = "wast_historical_recipe"
family = "trainable"
source = "OpenSTL WaST distribution"
source_url = "https://github.com/chengtan9907/OpenSTL"
source_commit = "eecf8a3078f0a178dbc7b28723da20f94ce36985"
paper_repository_url = "https://github.com/xuesongnie/WaST"
implementation_status = "CURRENT_AUDITED_WAST_WITH_RECONSTRUCTED_HISTORICAL_RECIPE"
configuration_status = "RECONSTRUCTED_FROM_LOCAL_TRAIN_ABLATION"
reference_config = "historical/train_ablation.py"
encoder_dim = 20
block_list = [2, 8, 2]
drop_path_rate = 0.1
mlp_ratio = 4.0

[training]
epochs = 100
batch_size = 4
drop_last = true
optimizer = "adamw"
learning_rate = 0.0001
weight_decay = 0.01
optimizer_betas = [0.9, 0.999]
optimizer_eps = 0.00000001
loss = "mse_hffl"
hffl_weight = 0.001
scheduled_sampling = false
scheduler = "cosine"
minimum_learning_rate = 0.000001
gradient_clip_norm = 0.0
protocol_status = "LOCKED_BY_USER_HISTORICAL_REPRODUCTION"
