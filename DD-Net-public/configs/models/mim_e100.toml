[model]
name = "mim_e100"
family = "trainable"
source = "OpenSTL benchmark PyTorch implementation"
source_url = "https://github.com/chengtan9907/OpenSTL"
source_commit = "eecf8a3078f0a178dbc7b28723da20f94ce36985"
official_reference_url = "https://github.com/Yunbo426/MIM"
official_reference_commit = "a61eb6a1be204cf0a7767ccbb61e2367a8b42401"
implementation_status = "OPENSTL_FALLBACK_OFFICIAL_RELEASE_IS_TENSORFLOW1"
configuration_status = "OPENSTL_REFERENCE_WITH_E100_RADAR_PROTOCOL"
reference_config = "OpenSTL configs/mmnist/MIM.py"
hidden_dims = [128, 128, 128, 128]
filter_size = 5
patch_size = 4
layer_norm = false

[training]
epochs = 100
batch_size = 4
drop_last = true
optimizer = "adam"
learning_rate = 0.0005
weight_decay = 0.0
loss = "model"
scheduled_sampling = true
sampling_unit = "sample_frame"
sampling_update_before_draw = true
scheduler = "onecycle"
gradient_clip_norm = 0.0
sampling_stop_iter = 13700
sampling_start_value = 1.0
sampling_changing_rate = 0.000072992700729927
protocol_status = "LOCKED_BY_USER"
