[experiment]
name = "tgrs_major_revision"
seed = 0
input_frames = 20
output_frames = 20
frame_interval_minutes = 6
normalization_scale = 70.0
evaluation_min = 0.0
evaluation_max = 70.0
thresholds_dbz = [10.0, 20.0, 30.0, 40.0]
device = "cuda"
num_workers = 4

[runtime]
checkpoint_every = 200
prediction_batch_size = 4
deterministic_cudnn = true

[data]
train_path = "data/train_data_new.npy"
test_path = "data/test_data_new.npy"
train_samples = 551
test_samples = 88
height = 64
width = 64
canonical_layout = "T,N,H,W"
model_layout = "N,T,C,H,W"
train_years = "2011-2017,2019-2021"
test_year = 2018

[selection]
strategy = "last_epoch"
validation_enabled = false
test_during_training = false
protocol_status = "LOCKED_BY_USER"

[evaluation]
comparison = ">="
categorical_aggregation = "pooled"
continuous_aggregation = "sample_frame_macro"
zero_denominator = 0.0
save_predictions = true
clip_predictions = true

[artifacts]
root = "artifacts"
