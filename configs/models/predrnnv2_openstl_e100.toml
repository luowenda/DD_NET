[model]
name = "predrnnv2_openstl_e100"
family = "trainable"
source = "OpenSTL benchmark"
source_url = "https://github.com/chengtan9907/OpenSTL"
source_commit = "eecf8a3078f0a178dbc7b28723da20f94ce36985"
implementation_status = "PINNED_OPENSTL_BENCHMARK_SELECTED"
configuration_status = "OPENSTL_MMNIST_REFERENCE_WITH_E100_RADAR_PROTOCOL"
reference_config = "OpenSTL configs/mmnist/PredRNNv2.py"
hidden_dims = [128, 128, 128, 128]
filter_size = 5
patch_size = 4
layer_norm = false
decouple_beta = 0.1
reverse_scheduled_sampling = true
r_sampling_step_1 = 6850
r_sampling_step_2 = 13700
r_exp_alpha = 2740

[training]
epochs = 100
batch_size = 4
drop_last = true
optimizer = "adam"
learning_rate = 0.0005
weight_decay = 0.0
loss = "model"
scheduled_sampling = true
sampling_unit = "sample_frame"
sampling_update_before_draw = true
scheduler = "onecycle"
gradient_clip_norm = 0.0
sampling_stop_iter = 13700
sampling_start_value = 1.0
sampling_changing_rate = 0.000072992700729927
protocol_status = "LOCKED_BY_USER"
