[model]
name = "swinlstm_e100"
family = "trainable"
source = "SongTang-x author-maintained SwinLSTM release"
source_url = "https://github.com/SongTang-x/SwinLSTM"
source_commit = "4425bcfefbebfac85c9fc6c6659361b8154d5ca3"
implementation_status = "AUTHOR_MAINTAINED_OFFICIAL_PYTORCH_RELEASE"
configuration_status = "OFFICIAL_ARCHITECTURE_WITH_E100_RADAR_PROTOCOL"
reference_config = "author release configs.py"
variant = "D"
patch_size = 2
embed_dim = 128
depths_downsample = [2, 6]
depths_upsample = [6, 2]
num_heads = [4, 8]
window_size = 4

[training]
epochs = 100
batch_size = 4
drop_last = true
optimizer = "adam"
learning_rate = 0.0001
weight_decay = 0.0
loss = "model"
scheduled_sampling = false
scheduler = "none"
gradient_clip_norm = 0.0
protocol_status = "LOCKED_BY_USER"
